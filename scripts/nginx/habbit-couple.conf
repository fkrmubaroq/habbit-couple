# Habbit Couple — konfigurasi nginx gabungan (1 file, 8 subdomain).
# Dikelola oleh scripts/deploy-nginx.mjs:
#   dipasang ke /etc/nginx/sites-available/habbit-couple.conf
#   + symlink ke /etc/nginx/sites-enabled/habbit-couple.conf
#
# Web (SPA statis, hasil deploy-app.mjs ke /var/www/habbit-couple/<app>):
#   habbit-tracker.saenahow.com  -> /var/www/habbit-couple/habbit-tracker-web
#   habbit-finance.saenahow.com  -> /var/www/habbit-couple/finance-tracker-web
#   habbit-grocery.saenahow.com  -> /var/www/habbit-couple/grocery-tracker-web
#   habbit-pomodoro.saenahow.com -> /var/www/habbit-couple/pomodoro-tracker-web
#
# API (proxy ke instance pm2):
#   api-habbit-tracker.saenahow.com  -> 127.0.0.1:7070
#   api-habbit-finance.saenahow.com  -> 127.0.0.1:5050
#   api-habbit-grocery.saenahow.com  -> 127.0.0.1:6060
#   api-habbit-pomodoro.saenahow.com -> 127.0.0.1:9090
#
# HTTPS (certbot) sengaja ditunda — semua .env.deploy masih memakai http://.

# ---------------------------------------------------------------------------
# Web statis
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name habbit-tracker.saenahow.com;

    root /var/www/habbit-couple/habbit-tracker-web;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

