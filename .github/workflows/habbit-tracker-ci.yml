name: Habit Tracker CI

on:
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Jalankan lint'
        type: boolean
        default: true
      run_check_types:
        description: 'Jalankan type-check'
        type: boolean
        default: true
      run_build:
        description: 'Jalankan build'
        type: boolean
        default: false

concurrency:
  group: habbit-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type-check (habit-tracker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (habit-tracker-api + habit-tracker-web)
        if: ${{ inputs.run_lint }}
        run: pnpm turbo run lint --filter=@repo/habbit-tracker-api --filter=@repo/habbit-tracker-web

      - name: Type-check (habit-tracker-api + habit-tracker-web)
        if: ${{ inputs.run_check_types }}
        run: pnpm turbo run check-types --filter=@repo/habbit-tracker-api --filter=@repo/habbit-tracker-web

      - name: Build (habit-tracker-api + habit-tracker-web)
        if: ${{ inputs.run_build }}
        run: pnpm turbo run build --filter=@repo/habbit-tracker-api --filter=@repo/habbit-tracker-web
